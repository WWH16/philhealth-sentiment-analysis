{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}PhilHealth CSM{% endblock %}</title>
  <meta name="description" content="PhilHealth Client Satisfaction Measurement Form -- LHIO Cauayan City. Share your feedback on your recent transaction.">

  <!-- Preconnect for Google Fonts & Icons (single declare here; CSS @import removed) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- IBM Plex Sans (UI) + IBM Plex Mono (timestamps) + Material Icons Round -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

  <!-- Tailwind CDN (dev only; replace with compiled CSS for production) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    document.documentElement.setAttribute('data-theme', 'light');
  </script>
  {% block styles %}{% endblock %}
</head>
<body>
  {% block nav %}
    {% include 'components/navbar.html' %}
  {% endblock %}

  {% block content %}{% endblock %}

  {% block scripts %}{% endblock %}
</body>
</html>
